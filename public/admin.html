<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAVEGIOUS | Admin App Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F3F2F7; }
    .app-box { background-color: #FFFFFF; border-radius: 28px; border: 1px solid rgba(0,0,0,0.05); }
    .app-btn { background-color: #7C3AED; color: #FFFFFF; transition: all 0.2s ease; }
    .app-btn:active { transform: scale(0.97); opacity: 0.9; }
  </style>
</head>
<body class="text-neutral-900 py-10 px-4">
  <div class="max-w-md mx-auto">
    
    <!-- AUTHENTICATION LAYER GATE -->
    <div id="loginGate" class="app-box p-8 text-center my-12 shadow-xl">
      <div class="w-14 h-14 bg-purple-50 text-purple-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl font-bold shadow-sm">🔑</div>
      <h2 class="font-extrabold text-2xl text-neutral-900 tracking-tight">Studio Gate</h2>
      <p class="text-neutral-400 text-xs font-bold uppercase tracking-wider mb-6">Verification Framework</p>
      <input type="password" id="gatePass" placeholder="••••••••" class="w-full p-4 border border-neutral-200 rounded-2xl text-center font-black tracking-widest text-lg mb-4 focus:outline-none bg-neutral-50 focus:ring-2 focus:ring-purple-500/20">
      <button id="loginBtn" class="w-full app-btn font-extrabold py-4 uppercase rounded-2xl tracking-widest text-xs shadow-md shadow-purple-600/10">Authorize Session</button>
    </div>

    <!-- MAIN APP STUDIO DASHBOARD -->
    <div id="adminTerminal" class="hidden space-y-8">
      
      <!-- Dashboard Top Header Row -->
      <div class="flex items-center justify-between border-b border-neutral-200/60 pb-4">
        <div>
          <h1 class="font-black text-xl tracking-tight text-neutral-900 uppercase">Lavegious Studio</h1>
          <p class="text-neutral-400 text-[10px] font-black uppercase tracking-widest mt-0.5">App Cloud Control Panel</p>
        </div>
        <button id="logoutBtn" class="px-4 py-2 bg-white border border-neutral-200 text-red-500 font-extrabold text-xs rounded-xl uppercase tracking-wider shadow-sm">Exit</button>
      </div>

      <!-- Core Configuration Drop Form -->
      <form id="uploadForm" class="app-box p-6 space-y-5 shadow-md">
        <h2 class="font-extrabold text-sm uppercase tracking-wider text-purple-600 border-b border-neutral-100 pb-2 flex items-center gap-2"><span>🚀</span> Drop New App Item</h2>
        
        <div>
          <label class="block text-[10px] font-black uppercase tracking-wider text-neutral-400 mb-2">Media Gallery Stream</label>
          <div class="relative bg-neutral-50 rounded-2xl p-6 text-center border-2 border-dashed border-neutral-200 hover:bg-neutral-100/50 transition cursor-pointer">
            <input type="file" id="pImg" multiple accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
            <div class="text-2xl mb-1">📸</div>
            <p id="statusTxt" class="text-xs font-bold text-neutral-700 uppercase">Tap to add photos from device gallery</p>
            <p class="text-[9px] text-neutral-400 font-medium uppercase tracking-wider mt-0.5">Auto-optimized via rapid engine</p>
          </div>
          <div id="previews" class="flex gap-2.5 mt-3 flex-wrap"></div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-[10px] font-black uppercase tracking-wider text-neutral-400 mb-1">Select Category</label>
            <select id="pCategory" class="w-full p-3.5 bg-neutral-50 border border-neutral-200 rounded-xl text-xs font-bold focus:outline-none focus:border-purple-500 cursor-pointer">
              <option value="Shirt">Shirt</option>
              <option value="Pant">Pant</option>
              <option value="Jeans">Jeans</option>
              <option value="Lower">Lower</option>
              <option value="Shoes">Shoes</option>
              <option value="T-Shirt">T-Shirt</option>
            </select>
          </div>
          <div class="flex items-center pt-5 pl-2">
            <label class="flex items-center gap-2 cursor-pointer select-none">
              <input type="checkbox" id="pFeatured" class="w-4 h-4 rounded text-purple-600 focus:ring-purple-500 border-neutral-300 accent-purple-600">
              <span class="text-[11px] font-bold text-neutral-600 uppercase tracking-tight">Set as Hero Main</span>
            </label>
          </div>
        </div>

        <div class="space-y-4">
          <div>
            <label class="block text-[10px] font-black uppercase tracking-wider text-neutral-400 mb-1">Product Title</label>
            <input type="text" id="pTitle" placeholder="e.g., Premium Regular Fit Striped Shirt" required class="w-full p-3.5 bg-neutral-50 border border-neutral-200 rounded-xl text-xs font-bold focus:outline-none focus:border-purple-500">
          </div>
          <div>
            <label class="block text-[10px] font-black uppercase tracking-wider text-neutral-400 mb-1">Price Tag (Plain Number Only)</label>
            <input type="text" id="pPrice" placeholder="e.g., 448" required class="w-full p-3.5 bg-neutral-50 border border-neutral-200 rounded-xl text-xs font-black focus:outline-none focus:border-purple-500">
          </div>
        </div>

        <div>
          <label class="block text-[10px] font-black uppercase tracking-wider text-neutral-400 mb-1">Specifications &amp; Fit Details</label>
          <textarea id="pDesc" placeholder="Describe fabrics, stitching matrices..." required class="w-full p-3.5 bg-neutral-50 border border-neutral-200 rounded-xl text-xs font-semibold focus:outline-none focus:border-purple-500 h-22 resize-none"></textarea>
        </div>

        <div>
          <label class="block text-[10px] font-black uppercase tracking-wider text-neutral-400 mb-1">Affiliate Link Destination</label>
          <input type="url" id="pLink" placeholder="https://fktr.in/..." required class="w-full p-3.5 bg-neutral-50 border border-neutral-200 rounded-xl text-xs font-semibold focus:outline-none focus:border-purple-500">
        </div>

        <button type="submit" id="subBtn" class="w-full app-btn font-black py-4 rounded-xl text-xs uppercase tracking-widest shadow-md shadow-purple-600/10">Publish Directly Live</button>
      </form>

      <!-- CONTROL LIVE CATALOG CHANNELS -->
      <div class="space-y-3">
        <h3 class="text-xs font-black uppercase tracking-wider text-neutral-400 px-1">📋 Live Catalog Index</h3>
        <div id="catalogList" class="grid grid-cols-1 gap-2.5"></div>
      </div>

    </div>
  </div>

  <script>
    let activeToken = localStorage.getItem('studioToken') || '';
    let imagesQueue = [];

    if(activeToken) {
      document.getElementById('loginGate').classList.add('hidden');
      document.getElementById('adminTerminal').classList.remove('hidden');
      loadCatalog();
    }

    document.getElementById('loginBtn').addEventListener('click', async () => {
      const pass = document.getElementById('gatePass').value;
      const res = await fetch('/api/admin/verify', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({password: pass})
      });
      if(res.ok) {
        localStorage.setItem('studioToken', pass);
        activeToken = pass;
        location.reload();
      } else {
        alert('Authentication Error: Token signatures mismatch.');
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('studioToken');
      location.reload();
    });

    function compressImg(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            if (w > 500) { h = Math.round((h * 500) / w); w = 500; }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.4));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    document.getElementById('pImg').addEventListener('change', async (e) => {
      imagesQueue = [];
      const previews = document.getElementById('previews');
      previews.innerHTML = '';
      const files = Array.from(e.target.files);
      document.getElementById('statusTxt').innerText = `OPTIMIZING PLOTS... STANDBY`;
      for(let f of files) {
        const b64 = await compressImg(f);
        imagesQueue.push(b64);
        previews.innerHTML += `
          <div class="relative w-12 h-14 rounded-xl overflow-hidden border border-neutral-200 shadow-sm">
            <img src="${b64}" class="w-full h-full object-cover">
          </div>`;
      }
      document.getElementById('statusTxt').innerText = `${files.length} MEDIA DROPS SYNC READY`;
    });

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if(imagesQueue.length === 0) return alert('Input Interruption: Target asset queue empty.');
      
      const btn = document.getElementById('subBtn');
      btn.innerText = "STREAMING INTO CLOUD DB MAP... WAIT";
      btn.disabled = true;

      const payload = {
        images: imagesQueue,
        title: document.getElementById('pTitle').value,
        price: document.getElementById('pPrice').value,
        description: document.getElementById('pDesc').value,
        link: document.getElementById('pLink').value,
        category: document.getElementById('pCategory').value,
        isFeatured: document.getElementById('pFeatured').checked
      };

      const res = await fetch('/api/products', {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'x-admin-password': activeToken},
        body: JSON.stringify(payload)
      });

      if(res.ok) {
        alert('Transaction Confirmed: System locked inside active clusters.');
        location.reload();
      } else {
        alert('Transaction Interrupted: Connection failure nodes.');
        btn.innerText = "Publish Directly Live";
        btn.disabled = false;
      }
    });

    window.makeHeroFeatured = async function(id) {
      const res = await fetch(`/api/products/${id}/feature`, {
        method: 'PUT',
        headers: {'x-admin-password': activeToken}
      });
      if(res.ok) {
        alert('Success: This item is now your website\'s main hero spotlight!');
        loadCatalog();
      }
    };

    async function loadCatalog() {
      const res = await fetch('/api/products');
      const data = await res.json();
      const list = document.getElementById('catalogList');
      list.innerHTML = data.length === 0 ? '<p class="text-xs text-neutral-400 font-bold uppercase py-4 text-center bg-white rounded-2xl border border-neutral-100">Index Map Empty</p>' : '';
      
      data.forEach(p => {
        const img = p.images && p.images.length > 0 ? p.images[0] : '';
        const heroTag = p.isFeatured ? `<span class="bg-purple-100 text-purple-700 px-2 py-0.5 rounded text-[8px] font-black tracking-wide uppercase">Active Hero</span>` : '';
        
        list.innerHTML += `
          <div class="flex items-center justify-between p-3 bg-white rounded-2xl border border-neutral-100 shadow-sm">
            <div class="flex items-center gap-3 min-w-0">
              <img src="${img}" class="w-9 h-11 object-cover rounded-xl border border-neutral-100 flex-shrink-0">
              <div class="min-w-0">
                <div class="flex items-center gap-1.5 min-w-0">
                  <span class="text-xs font-extrabold text-neutral-800 truncate block uppercase">${p.title}</span>
                  ${heroTag}
                </div>
                <span class="text-[9px] font-black text-purple-600 uppercase block mt-0.5">${p.category} | ₹${p.price}</span>
              </div>
            </div>
            <div class="flex items-center gap-1.5 flex-shrink-0">
              <button onclick="makeHeroFeatured('${p._id}')" class="px-2.5 py-1.5 bg-purple-50 hover:bg-purple-100 text-purple-600 border border-purple-100 font-extrabold text-[9px] uppercase rounded-xl transition">Set Hero</button>
              <button onclick="deleteItem('${p._id}')" class="px-2.5 py-1.5 bg-red-50 hover:bg-red-100 text-red-500 font-bold text-[9px] uppercase rounded-xl transition">Delete</button>
            </div>
          </div>`;
      });
    }

    window.deleteItem = async function(id) {
      if(!confirm('Purge active asset sequence completely?')) return;
      const res = await fetch(`/api/products/${id}`, {
        method: 'DELETE',
        headers: {'x-admin-password': activeToken}
      });
      if(res.ok) { loadCatalog(); }
    };
  </script>
</body>
</html>
