<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAVEGIOUS | Admin Studio Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FAFAFA; }
    .neo-box { border: 4px solid #000000; box-shadow: 6px 6px 0px 0px #000000; }
    .neo-btn { border: 3px solid #000000; box-shadow: 4px 4px 0px 0px #000000; transition: all 0.1s ease; }
    .neo-btn:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px 0px #000000; }
  </style>
</head>
<body class="text-black py-10 px-4">
  <div class="max-w-xl mx-auto">
    
    <!-- LOGIN GATE INTERFACE -->
    <div id="loginGate" class="neo-box bg-white p-8 rounded-[24px] text-center max-w-md mx-auto my-12">
      <div class="w-12 h-12 bg-neutral-100 rounded-full flex items-center justify-center mx-auto mb-4 text-xl">🔒</div>
      <h2 class="font-black text-2xl uppercase mb-2 tracking-tight">Studio Authorization</h2>
      <p class="text-neutral-400 text-xs font-semibold uppercase tracking-wider mb-6">Enter Matrix Access Token</p>
      <input type="password" id="gatePass" placeholder="••••••••" class="w-full p-4 border-4 border-black rounded-xl text-center font-black tracking-widest text-lg mb-4 focus:outline-none bg-neutral-50">
      <button id="loginBtn" class="w-full neo-btn bg-black text-white font-extrabold py-4 uppercase rounded-xl tracking-wider text-xs">Verify Handshake</button>
    </div>

    <!-- MAIN HIDDEN ADMIN TERMINAL -->
    <div id="adminTerminal" class="hidden space-y-10">
      
      <!-- Studio Header -->
      <div class="flex items-center justify-between border-b-4 border-black pb-4">
        <div>
          <h1 class="font-black text-2xl tracking-tighter uppercase">LAVEGIOUS STUDIO</h1>
          <p class="text-neutral-400 text-[10px] font-bold uppercase tracking-widest mt-0.5">Control Grid Matrix Panel</p>
        </div>
        <button id="logoutBtn" class="px-4 py-2 bg-red-50 border-2 border-black text-red-600 font-black text-xs rounded-xl uppercase tracking-wider">Lock Console</button>
      </div>

      <!-- Core Upload Form Container -->
      <form id="uploadForm" class="neo-box bg-white p-6 md:p-8 rounded-[32px] space-y-6">
        <h2 class="font-black text-lg uppercase tracking-tight border-b-2 border-neutral-100 pb-2">📦 Drop New Outfit</h2>
        
        <div>
          <label class="block text-xs font-black uppercase tracking-wider text-neutral-500 mb-2">Upload Outfit Images (Multiple Allowed)</label>
          <div class="relative neo-box bg-neutral-50 rounded-2xl p-6 text-center border-2 border-dashed border-neutral-300 hover:bg-neutral-100 transition cursor-pointer">
            <input type="file" id="pImg" multiple accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
            <div class="text-2xl mb-1">📸</div>
            <p id="statusTxt" class="text-xs font-extrabold text-neutral-800 uppercase tracking-tight">Tap to add photos from device gallery</p>
            <p class="text-[10px] text-neutral-400 font-bold uppercase tracking-wider mt-1">Images auto-compress for high performance</p>
          </div>
          <!-- Real-time Image Previews Grid Location -->
          <div id="previews" class="flex gap-3 mt-4 flex-wrap"></div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="md:col-span-2">
            <label class="block text-xs font-black uppercase tracking-wider text-neutral-500 mb-1">Concept Heading</label>
            <input type="text" id="pTitle" placeholder="e.g. Premium Oversized Fleece Hoodie" required class="w-full p-3.5 border-2 border-black rounded-xl text-sm font-bold bg-neutral-50">
          </div>
          <div>
            <label class="block text-xs font-black uppercase tracking-wider text-neutral-500 mb-1">Price tag</label>
            <input type="text" id="pPrice" placeholder="e.g. ₹1,499" required class="w-full p-3.5 border-2 border-black rounded-xl text-sm font-black bg-neutral-50">
          </div>
        </div>

        <div>
          <label class="block text-xs font-black uppercase tracking-wider text-neutral-500 mb-1">Material &amp; Fit Instructions</label>
          <textarea id="pDesc" placeholder="Crafted from 100% loopback cotton thread matrices..." required class="w-full p-3.5 border-2 border-black rounded-xl text-sm font-medium bg-neutral-50 h-28 resize-none"></textarea>
        </div>

        <div>
          <label class="block text-xs font-black uppercase tracking-wider text-neutral-500 mb-1">Flipkart Affiliate URL Redirect Destination</label>
          <input type="url" id="pLink" placeholder="https://fktr.in/..." required class="w-full p-3.5 border-2 border-black rounded-xl text-sm font-medium bg-neutral-50">
        </div>

        <button type="submit" id="subBtn" class="w-full neo-btn bg-[#FBBF24] text-black font-black py-4 rounded-xl text-xs uppercase tracking-widest shadow-md">Publish Directly Live</button>
      </form>

      <!-- ACTIVE CATALOG MANAGEMENT SECTION -->
      <div class="space-y-4">
        <h3 class="font-black text-base uppercase tracking-wider text-neutral-800">📋 Active Catalog Management</h3>
        <div id="catalogList" class="grid grid-cols-1 gap-3">
          <!-- Injected dynamically via client engine routing -->
        </div>
      </div>

    </div>
  </div>

  <!-- CLIENT ROUTING ENGINE SYSTEM LOGICS -->
  <script>
    let activeToken = localStorage.getItem('studioToken') || '';
    let imagesQueue = [];

    // Validates local persistence token handshake routine
    if(activeToken) {
      document.getElementById('loginGate').classList.add('hidden');
      document.getElementById('adminTerminal').classList.remove('hidden');
      loadCatalog();
    }

    document.getElementById('loginBtn').addEventListener('click', async () => {
      const pass = document.getElementById('gatePass').value;
      const res = await fetch('/api/admin/verify', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({password: pass})
      });
      if(res.ok) {
        localStorage.setItem('studioToken', pass);
        activeToken = pass;
        location.reload();
      } else {
        alert('Authentication Failed: Invalid token structure match.');
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('studioToken');
      location.reload();
    });

    // High performance image canvas matrix optimization routine
    function compressImg(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            if (w > 800) { h = Math.round((h * 800) / w); w = 800; }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.6));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    document.getElementById('pImg').addEventListener('change', async (e) => {
      imagesQueue = [];
      const previews = document.getElementById('previews');
      previews.innerHTML = '';
      const files = Array.from(e.target.files);
      
      document.getElementById('statusTxt').innerText = `PROCESSING ${files.length} PHOTOS INTO DATABASE MATRIX...`;
      
      for(let f of files) {
        const b64 = await compressImg(f);
        imagesQueue.push(b64);
        previews.innerHTML += `
          <div class="relative w-16 h-20 rounded-xl overflow-hidden border-2 border-black shadow-sm">
            <img src="${b64}" class="w-full h-full object-cover">
          </div>`;
      }
      document.getElementById('statusTxt').innerText = `${files.length} OUTFIT IMAGE(S) ARCHITECTURE SYNC READY`;
    });

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if(imagesQueue.length === 0) return alert('Verification Interrupted: Please push at least 1 image block asset.');
      
      const btn = document.getElementById('subBtn');
      btn.innerText = "STREAMING INTO CLOUD DB MAP... WAIT";
      btn.disabled = true;

      const payload = {
        images: imagesQueue,
        title: document.getElementById('pTitle').value,
        price: document.getElementById('pPrice').value,
        description: document.getElementById('pDesc').value,
        link: document.getElementById('pLink').value
      };

      const res = await fetch('/api/products', {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'x-admin-password': activeToken},
        body: JSON.stringify(payload)
      });

      if(res.ok) {
        alert('System Handshake Success: Product locked into live collection streams!');
        location.reload();
      } else {
        alert('Transaction Revoked: Verify database status token endpoints.');
        btn.innerText = "Publish Directly Live";
        btn.disabled = false;
      }
    });

    async function loadCatalog() {
      const res = await fetch('/api/products');
      const data = await res.json();
      const list = document.getElementById('catalogList');
      list.innerHTML = data.length === 0 ? '<p class="text-xs text-neutral-400 font-bold uppercase tracking-wider py-4 text-center bg-white border-2 border-black rounded-xl">Catalog empty inside cloud node</p>' : '';
      
      data.forEach(p => {
        const img = p.images && p.images.length > 0 ? p.images[0] : 'https://images.unsplash.com/photo-1509631179647-0177331693ae?q=80&w=600';
        list.innerHTML += `
          <div class="flex items-center justify-between p-3 bg-white border-2 border-black rounded-xl shadow-sm">
            <div class="flex items-center gap-3 min-w-0">
              <img src="${img}" class="w-10 h-12 object-cover border border-black rounded-lg flex-shrink-0">
              <div class="min-w-0">
                <span class="text-xs font-black uppercase truncate block text-neutral-900">${p.title}</span>
                <span class="text-[10px] font-bold text-neutral-400 uppercase tracking-tight block mt-0.5">${p.price}</span>
              </div>
            </div>
            <button onclick="deleteItem('${p._id}')" class="px-3 py-1.5 bg-red-500 hover:bg-red-600 border border-black text-white font-black text-[10px] uppercase rounded-lg shadow-sm flex-shrink-0">Delete</button>
          </div>`;
      });
    }

    window.deleteItem = async function(id) {
      if(!confirm('Erase target item sequence from cloud streams permanently?')) return;
      const res = await fetch(`/api/products/${id}`, {
        method: 'DELETE',
        headers: {'x-admin-password': activeToken}
      });
      if(res.ok) { loadCatalog(); }
    };
  </script>
</body>
</html>
