<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAVEGIOUS | Premium App View</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F3F2F7; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    .category-chip { transition: all 0.2s ease; }
    .category-chip.active { background-color: #7C3AED; color: #FFFFFF; }
    .neo-card { border: 1px solid rgba(0,0,0,0.03); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .detail-overlay { position: fixed; inset: 0; background-color: #F3F2F7; z-index: 100; overflow-y: auto; }
  </style>
</head>
<body class="text-neutral-900 antialiased">

  <!-- MAIN APP WINDOW VIEW -->
  <div id="shopMainView" class="max-w-md mx-auto min-h-screen bg-[#F3F2F7] flex flex-col justify-between pb-6 shadow-2xl relative">
    
    <!-- APP HEADER CONTAINER -->
    <div class="px-5 pt-6 space-y-4 bg-[#F3F2F7] sticky top-0 z-40 pb-2">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-purple-200 border-2 border-white flex items-center justify-center font-bold text-purple-700 shadow-sm">LV</div>
          <div>
            <h1 class="text-xs font-bold text-neutral-400 uppercase tracking-wider leading-none">Welcome to</h1>
            <span class="text-lg font-extrabold text-neutral-900 tracking-tight uppercase">LAVEGIOUS</span>
          </div>
        </div>
        <a href="/" class="w-9 h-9 bg-white rounded-full flex items-center justify-center shadow-sm border border-neutral-100 font-bold text-xs text-neutral-700">←</a>
      </div>

      <!-- SEARCH BAR -->
      <div class="relative">
        <span class="absolute inset-y-0 left-4 flex items-center text-neutral-400">🔍</span>
        <input type="text" id="appSearchInput" placeholder="Search outfits, brands, drops..." class="w-full pl-11 pr-4 py-3.5 bg-white rounded-2xl text-sm font-semibold shadow-sm focus:outline-none border border-neutral-100 placeholder-neutral-400">
      </div>

      <!-- DYNAMIC CATEGORIES -->
      <div class="flex gap-2.5 overflow-x-auto scrollbar-none py-1">
        <button onclick="filterByCategory('all', this)" class="category-chip active px-5 py-2.5 bg-white rounded-xl text-xs font-bold shadow-sm border border-neutral-100 flex-shrink-0 tracking-wide uppercase">All Mix</button>
        <button onclick="filterByCategory('shirt', this)" class="category-chip px-5 py-2.5 bg-white rounded-xl text-xs font-bold shadow-sm border border-neutral-100 flex-shrink-0 tracking-wide uppercase">Shirt</button>
        <button onclick="filterByCategory('pant', this)" class="category-chip px-5 py-2.5 bg-white rounded-xl text-xs font-bold shadow-sm border border-neutral-100 flex-shrink-0 tracking-wide uppercase">Pant</button>
        <button onclick="filterByCategory('jeans', this)" class="category-chip px-5 py-2.5 bg-white rounded-xl text-xs font-bold shadow-sm border border-neutral-100 flex-shrink-0 tracking-wide uppercase">Jeans</button>
        <button onclick="filterByCategory('lower', this)" class="category-chip px-5 py-2.5 bg-white rounded-xl text-xs font-bold shadow-sm border border-neutral-100 flex-shrink-0 tracking-wide uppercase">Lower</button>
        <button onclick="filterByCategory('shoes', this)" class="category-chip px-5 py-2.5 bg-white rounded-xl text-xs font-bold shadow-sm border border-neutral-100 flex-shrink-0 tracking-wide uppercase">Shoes</button>
        <button onclick="filterByCategory('tshirt', this)" class="category-chip px-5 py-2.5 bg-white rounded-xl text-xs font-bold shadow-sm border border-neutral-100 flex-shrink-0 tracking-wide uppercase">T-Shirt</button>
      </div>

      <!-- ADVANCED FILTERS AND SORTING -->
      <div class="bg-white p-3 rounded-2xl shadow-sm flex flex-col gap-2.5 border border-neutral-100">
        <div class="flex items-center justify-between text-xs font-bold text-neutral-500 uppercase tracking-wider px-1">
          <span>🎛️ Sort Price:</span>
          <select id="priceSorter" onchange="applyFiltersAndSorting()" class="bg-transparent text-purple-600 font-extrabold focus:outline-none cursor-pointer">
            <option value="default">Default Sync</option>
            <option value="lowHigh">Low to High</option>
            <option value="highLow">High to Low</option>
          </select>
        </div>
        <div class="h-[1px] bg-neutral-100 w-full"></div>
        <div class="flex items-center justify-between text-xs font-bold text-neutral-500 uppercase tracking-wider px-1">
          <span>💰 Max Limit:</span>
          <div class="flex items-center gap-2">
            <input type="range" id="priceRangeSlider" min="0" max="5000" value="5000" oninput="updateRangeLabel(this.value)" class="w-24 h-1 bg-neutral-200 rounded-lg appearance-none cursor-pointer accent-purple-600">
            <span id="rangeLabel" class="text-purple-600 font-extrabold">₹5000</span>
          </div>
        </div>
      </div>
    </div>

    <!-- PRODUCT FEED GRID -->
    <div class="px-5 py-4 flex-1">
      <div id="appProductGrid" class="grid grid-cols-2 gap-4"></div>
    </div>

  </div>

  <!-- ==================== SINGLE PRODUCT DETAIL VIEW OVERLAY ==================== -->
  <div id="productDetailPage" class="detail-overlay hidden max-w-md mx-auto min-h-screen flex flex-col justify-between pb-6">
    <div class="w-full">
      
      <!-- Top Action Navigation -->
      <div class="px-5 pt-6 flex items-center justify-between absolute top-0 left-0 right-0 z-50">
        <button id="backToGridBtn" class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-md font-bold text-sm">✕</button>
        <span class="font-extrabold text-sm uppercase tracking-widest text-neutral-800 bg-white/80 backdrop-blur-sm px-4 py-2 rounded-full shadow-sm">Details View</span>
        <button class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-md text-red-500 font-bold text-base">♥</button>
      </div>

      <!-- Swipable Image Slider -->
      <div class="relative bg-neutral-200 aspect-square w-full overflow-hidden rounded-b-[36px] shadow-sm">
        <div id="detailSlider" class="w-full h-full flex overflow-x-auto snap-x snap-mandatory scrollbar-none"></div>
      </div>

      <!-- Specs Frame Area Description Sheets -->
      <div class="px-5 pt-6 space-y-5">
        <div class="flex items-start justify-between gap-4">
          <div class="min-w-0 max-w-[70%]">
            <h2 id="detailTitle" class="font-extrabold text-xl text-neutral-900 uppercase tracking-tight leading-tight break-words"></h2>
            <div class="flex items-center gap-1.5 mt-1.5">
              <span class="text-amber-500 font-bold text-sm">★ 4.1</span>
              <span class="text-neutral-400 text-xs font-bold tracking-tight">(10.2K+ Verified Reviews)</span>
            </div>
          </div>
          <div class="text-right flex-shrink-0">
            <span id="detailPrice" class="inline-block bg-purple-600 text-white font-black px-3.5 py-2 rounded-2xl text-base shadow-sm"></span>
          </div>
        </div>

        <!-- NEW INLINE BUY NOW BUTTON REPLACING DUMMY SIZES & COLORS -->
        <div class="pt-1 border-t border-neutral-200/60 pt-4">
          <a id="inlineBuyBtn" target="_blank" class="block w-full text-center bg-purple-600 hover:bg-purple-700 text-white font-black uppercase py-4 rounded-2xl text-xs tracking-widest shadow-md shadow-purple-600/10 transition duration-200">
            BUY NOW (GO TO FLIPKART) →
          </a>
        </div>

        <div class="border-t border-neutral-200/60 pt-4 space-y-1.5">
          <span class="block text-xs font-black uppercase tracking-wider text-neutral-400">Product Specifications</span>
          <p id="detailDesc" class="text-neutral-500 text-xs font-medium leading-relaxed bg-white p-4 rounded-2xl border border-neutral-100 whitespace-pre-line shadow-sm"></p>
        </div>
      </div>
    </div>
    
    <div class="px-5 pt-4">
      <a id="detailBuyBtn" target="_blank" class="block w-full text-center bg-purple-600 hover:bg-purple-700 text-white font-extrabold uppercase py-4 rounded-2xl text-xs tracking-widest shadow-md transition duration-200">
        Buy Outfit Matrix (Flipkart)
      </a>
    </div>
  </div>

  <!-- LOOPS LOGICS INFRASTRUCTURE ENGINE -->
  <script>
    const appProductGrid = document.getElementById('appProductGrid');
    const shopMainView = document.getElementById('shopMainView');
    const productDetailPage = document.getElementById('productDetailPage');
    const backToGridBtn = document.getElementById('backToGridBtn');
    const detailSlider = document.getElementById('detailSlider');
    const detailTitle = document.getElementById('detailTitle');
    const detailDesc = document.getElementById('detailDesc');
    const detailPrice = document.getElementById('detailPrice');
    const detailBuyBtn = document.getElementById('detailBuyBtn');
    const inlineBuyBtn = document.getElementById('inlineBuyBtn');
    
    let rawInventoryMaster = [];
    let activeCategoryFilter = 'all';
    let currentMaxPrice = 5000;

    function formatRupeeSymbol(priceText) {
      let pureDigits = priceText.toString().replace(/[^0-9]/g, '').trim();
      return '₹' + (pureDigits || '0');
    }

    function updateRangeLabel(val) {
      currentMaxPrice = parseInt(val);
      document.getElementById('rangeLabel').innerText = '₹' + val;
      applyFiltersAndSorting();
    }

    function filterByCategory(categoryKey, chipRef) {
      activeCategoryFilter = categoryKey.toLowerCase().trim();
      document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
      chipRef.classList.add('active');
      applyFiltersAndSorting();
    }

    document.getElementById('appSearchInput').addEventListener('input', () => {
      applyFiltersAndSorting();
    });

    async function bootstrapAppView() {
      try {
        const networkResponse = await fetch('/api/products');
        rawInventoryMaster = await networkResponse.json();
        applyFiltersAndSorting();
      } catch (err) {
        appProductGrid.innerHTML = '<div class="col-span-full py-10 text-center text-xs font-bold text-red-400 uppercase tracking-widest">Pipeline Stream Error.</div>';
      }
    }

    function applyFiltersAndSorting() {
      let processStream = [...rawInventoryMaster];
      const keyword = document.getElementById('appSearchInput').value.toLowerCase().trim();

      if(keyword) {
        processStream = processStream.filter(p => p.title.toLowerCase().includes(keyword) || p.description.toLowerCase().includes(keyword));
      }

      if(activeCategoryFilter !== 'all') {
        processStream = processStream.filter(p => (p.category || '').toLowerCase().trim() === activeCategoryFilter);
      }

      processStream = processStream.filter(p => {
        let numericPrice = parseInt(p.price.toString().replace(/[^0-9]/g, '')) || 0;
        return numericPrice <= currentMaxPrice;
      });

      const sortingMode = document.getElementById('priceSorter').value;
      if(sortingMode === 'lowHigh') {
        processStream.sort((a,b) => (parseInt(a.price.toString().replace(/[^0-9]/g, '')) || 0) - (parseInt(b.price.toString().replace(/[^0-9]/g, '')) || 0));
      } else if(sortingMode === 'highLow') {
        processStream.sort((a,b) => (parseInt(b.price.toString().replace(/[^0-9]/g, '')) || 0) - (parseInt(a.price.toString().replace(/[^0-9]/g, '')) || 0));
      }

      renderAppGridCards(processStream);
    }

    function renderAppGridCards(renderedArray) {
      appProductGrid.innerHTML = renderedArray.length === 0 
        ? '<div class="col-span-full py-12 text-center text-xs font-bold text-neutral-400 uppercase tracking-widest">No matching outfits dropped.</div>' 
        : '';

      renderedArray.forEach(p => {
        const gridFirstImage = p.images && p.images.length > 0 ? p.images[0] : '';
        const customPriceTag = formatRupeeSymbol(p.price);

        appProductGrid.innerHTML += `
          <div onclick="launchOverlayProductPage('${p._id}')" class="bg-white rounded-[24px] p-3 shadow-sm hover:shadow-md transition duration-200 cursor-pointer flex flex-col justify-between border border-neutral-100/40 relative">
            <div>
              <div class="aspect-square w-full bg-neutral-100 rounded-[18px] overflow-hidden relative mb-2.5 shadow-inner">
                <img src="${gridFirstImage}" class="w-full h-full object-cover">
                <div class="absolute top-2 right-2 bg-white/80 backdrop-blur-sm px-1.5 py-0.5 rounded-full text-[9px] font-black text-amber-600 shadow-sm flex items-center gap-0.5">★ 4.1</div>
              </div>
              <h3 class="font-bold text-xs uppercase tracking-tight text-neutral-800 line-clamp-2 px-0.5 leading-snug">${p.title}</h3>
            </div>
            <div class="flex items-center justify-between pt-2.5 border-t border-neutral-100/80 mt-2 px-0.5">
              <span class="font-extrabold text-neutral-900 text-sm tracking-tight">${customPriceTag}</span>
              <div class="w-7 h-7 bg-purple-600 text-white rounded-xl flex items-center justify-center font-bold text-xs shadow-sm">+</div>
            </div>
          </div>`;
      });
    }

    window.launchOverlayProductPage = function(id) {
      const activeItem = rawInventoryMaster.find(item => item._id === id);
      if(!activeItem) return;

      detailSlider.innerHTML = '';
      const loopImages = activeItem.images && activeItem.images.length > 0 ? activeItem.images : [];
      
      loopImages.forEach(img => {
        detailSlider.innerHTML += `
          <div class="w-full h-full flex-shrink-0 snap-start bg-neutral-900 flex justify-center items-center">
            <img src="${img}" class="w-full h-full object-contain">
          </div>`;
      });

      detailTitle.innerText = activeItem.title;
      detailDesc.innerText = activeItem.description;
      detailPrice.innerText = formatRupeeSymbol(activeItem.price);
      
      // Binds both dynamic action buttons straight to the Flipkart affiliate endpoint URL
      detailBuyBtn.href = activeItem.link;
      inlineBuyBtn.href = activeItem.link;

      shopMainView.classList.add('hidden');
      productDetailPage.classList.remove('hidden');
      window.scrollTo({ top: 0 });
    };

    backToGridBtn.addEventListener('click', () => {
      productDetailPage.classList.add('hidden');
      shopMainView.classList.remove('hidden');
    });

    bootstrapAppView();
  </script>
</body>
</html>
