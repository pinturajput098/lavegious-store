<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAVEGIOUS | Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-black p-6">
  <a href="/" class="text-sm font-bold uppercase underline">← Back Home</a>
  <h1 class="text-4xl font-black uppercase my-8">All Products</h1>
  <div id="dynamicProductGrid" class="grid grid-cols-1 md:grid-cols-4 gap-6"></div>
  <script>
    async function loadShop() {
      const res = await fetch('/api/products');
      const products = await res.json();
      const grid = document.getElementById('dynamicProductGrid');
      products.forEach(p => {
        grid.innerHTML += `
          <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
            <img src="${p.images[0]}" class="w-full h-64 object-cover rounded-xl mb-4">
            <h3 class="font-bold uppercase">${p.title}</h3>
            <p class="font-black text-lg">${p.price}</p>
            <a href="${p.link}" target="_blank" class="block bg-black text-white text-center py-2 mt-4 rounded-lg font-bold uppercase text-xs">Buy Now</a>
          </div>`;
      });
    }
    loadShop();
  </script>
</body>
</html>
