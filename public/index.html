<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAVEGIOUS | Curated Streetwear</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FAFAFA; }
    .neo-card { border: 4px solid #141414; box-shadow: 6px 6px 0px 0px #141414; transition: all 0.2s ease; }
    .neo-card:hover { transform: translate(-2px, -2px); box-shadow: 8px 8px 0px 0px #141414; }
    .neo-btn { border: 3px solid #141414; box-shadow: 4px 4px 0px 0px #141414; }
    .neo-btn:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px 0px #141414; }
  </style>
</head>
<body class="text-black">

  <!-- Main Website Stream -->
  <div id="mainWebsiteView" class="max-w-md mx-auto min-h-screen flex flex-col justify-between px-4 pt-6 pb-24">
    <div>
      <header class="flex items-center justify-between mb-8 pb-4 border-b-4 border-black">
        <h1 class="font-extrabold text-2xl tracking-tighter uppercase">LAVEGIOUS<span class="text-[#10B981]">.</span></h1>
      </header>

      <div class="text-center mb-8">
        <h2 class="font-extrabold text-3xl uppercase tracking-tight mb-1">CURATED<br><span class="text-[#10B981] underline decoration-4">STREETWEAR</span></h2>
        <p class="text-neutral-400 text-[10px] font-bold uppercase tracking-widest">Premium Live Action Grid Matrix</p>
      </div>

      <!-- Live Product Cards Grid -->
      <div id="productGrid" class="grid grid-cols-1 gap-6"></div>
    </div>
  </div>

  <!-- Product Detail Overlay Page -->
  <div id="productDetailPage" class="max-w-md mx-auto min-h-screen bg-white hidden flex flex-col justify-between pb-6">
    <div>
      <div class="relative border-b-4 border-black bg-neutral-100 aspect-[3/4] w-full overflow-hidden">
        <button id="backToGridBtn" class="absolute top-4 left-4 z-10 neo-btn bg-white text-black px-4 py-2 font-extrabold text-xs uppercase rounded-lg">← Back</button>
        <div id="detailSlider" class="w-full h-full flex overflow-x-auto snap-x snap-mandatory scrollbar-none"></div>
      </div>
      <div class="p-6">
        <h2 id="detailTitle" class="font-extrabold text-2xl uppercase tracking-tight text-black mb-2"></h2>
        <span id="detailPrice" class="inline-block bg-black text-white font-extrabold px-3 py-1.5 rounded-md text-sm mb-4"></span>
        <p id="detailDesc" class="text-neutral-600 text-sm font-medium leading-relaxed border-t-2 border-neutral-100 pt-4"></p>
      </div>
    </div>
    <div class="px-6 pt-4">
      <a id="detailBuyBtn" target="_blank" class="block w-full text-center neo-btn bg-[#FBBF24] text-black font-extrabold uppercase py-4 rounded-xl text-sm tracking-wider">Get Outfit via Flipkart</a>
    </div>
  </div>

  <script>
    const productGrid = document.getElementById('productGrid');
    const mainWebsiteView = document.getElementById('mainWebsiteView');
    const productDetailPage = document.getElementById('productDetailPage');
    const backToGridBtn = document.getElementById('backToGridBtn');
    const detailSlider = document.getElementById('detailSlider');
    const detailTitle = document.getElementById('detailTitle');
    const detailDesc = document.getElementById('detailDesc');
    const detailPrice = document.getElementById('detailPrice');
    const detailBuyBtn = document.getElementById('detailBuyBtn');
    let globalProducts = [];

    async function loadStore() {
      try {
        const res = await fetch('/api/products');
        globalProducts = await res.json();
        productGrid.innerHTML = globalProducts.length === 0 ? '<p class="text-center font-bold text-neutral-400 py-12">No Outfits Dropped Yet.</p>' : '';
        globalProducts.forEach(p => {
          const img = p.images && p.images.length > 0 ? p.images[0] : 'https://images.unsplash.com/photo-1509631179647-0177331693ae?q=80&w=600';
          productGrid.innerHTML += `
            <div onclick="openProduct('${p._id}')" class="neo-card bg-white overflow-hidden cursor-pointer flex flex-col">
              <div class="aspect-[3/4] w-full bg-neutral-100 border-b-4 border-black relative">
                <img src="${img}" class="w-full h-full object-cover">
                <div class="absolute top-3 left-3 bg-black text-[#FBBF24] font-extrabold text-[9px] px-2 py-1 rounded-sm">LIVE LOOK</div>
              </div>
              <div class="p-5 flex-1 flex flex-col justify-between">
                <h3 class="font-extrabold text-lg uppercase tracking-tight mb-1">${p.title}</h3>
                <div class="flex items-center justify-between pt-3 border-t-2 border-neutral-100 mt-3">
                  <span class="font-extrabold text-base">${p.price}</span>
                  <button class="neo-btn bg-[#10B981] text-white font-bold text-[10px] uppercase px-3 py-1.5 rounded-md">View Specs</button>
                </div>
              </div>
            </div>`;
        });
      } catch (err) {}
    }

    window.openProduct = function(id) {
      const p = globalProducts.find(item => item._id === id);
      if(!p) return;
      detailSlider.innerHTML = '';
      (p.images && p.images.length > 0 ? p.images : [p.image]).forEach(img => {
        detailSlider.innerHTML += `<img src="${img}" class="w-full h-full object-cover flex-shrink-0 snap-start">`;
      });
      detailTitle.innerText = p.title;
      detailDesc.innerText = p.description;
      detailPrice.innerText = p.price;
      detailBuyBtn.href = p.link;
      mainWebsiteView.classList.add('hidden');
      productDetailPage.classList.remove('hidden');
      window.scrollTo({ top: 0 });
    };

    backToGridBtn.addEventListener('click', () => {
      productDetailPage.classList.add('hidden');
      mainWebsiteView.classList.remove('hidden');
    });

    loadStore();
  </script>
</body>
</html>
