<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAVEGIOUS | Premium Fashion App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F3F2F7; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    .category-chip { transition: all 0.2s ease; }
    .category-chip.active { background-color: #7C3AED; color: #FFFFFF; }
    .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 28rem; background-color: #FFFFFF; border-top: 1px solid rgba(0,0,0,0.06); z-index: 50; }
  </style>
</head>
<body class="text-neutral-900 antialiased">

  <!-- MAIN APP CONTAINER WRAPPER -->
  <div class="max-w-md mx-auto min-h-screen bg-[#F3F2F7] flex flex-col justify-between pb-24 shadow-2xl relative">
    
    <!-- HEADER AND WELCOME PROFILE BANNER -->
    <div class="px-5 pt-6 space-y-4 sticky top-0 bg-[#F3F2F7] z-40 pb-2">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 rounded-full bg-purple-600 border-2 border-white flex items-center justify-center font-extrabold text-white text-sm shadow-md shadow-purple-600/20">LV</div>
          <div>
            <h1 class="text-xs font-bold text-neutral-400 uppercase tracking-wider leading-none">Good Morning</h1>
            <span class="text-base font-extrabold text-neutral-900 tracking-tight">Hey, Fashionista</span>
          </div>
        </div>
        <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm border border-neutral-100/60 text-lg cursor-pointer">🔔</div>
      </div>

      <!-- REDIRECT SEARCH CAPABILITY BAR LINK -->
      <div onclick="window.location.href='/shop'" class="relative cursor-pointer">
        <span class="absolute inset-y-0 left-4 flex items-center text-neutral-400">🔍</span>
        <div class="w-full pl-11 pr-4 py-3.5 bg-white rounded-2xl text-sm font-semibold shadow-sm border border-neutral-100/60 text-neutral-400 select-none">
          Search outfits, brands, categories...
        </div>
      </div>

      <!-- DYNAMIC HOME FILTERING CHIPS -->
      <div class="flex gap-2.5 overflow-x-auto scrollbar-none py-1">
        <button onclick="filterHomeCategory('all', this)" class="category-chip active px-5 py-2.5 bg-white rounded-xl text-xs font-bold shadow-sm border border-neutral-100/60 flex-shrink-0 tracking-wide uppercase">Trending</button>
        <button onclick="filterHomeCategory('shirt', this)" class="category-chip px-5 py-2.5 bg-white rounded-xl text-xs font-bold shadow-sm border border-neutral-100/60 flex-shrink-0 tracking-wide uppercase">Shirt</button>
        <button onclick="filterHomeCategory('pant', this)" class="category-chip px-5 py-2.5 bg-white rounded-xl text-xs font-bold shadow-sm border border-neutral-100/60 flex-shrink-0 tracking-wide uppercase">Pant</button>
        <button onclick="filterHomeCategory('jeans', this)" class="category-chip px-5 py-2.5 bg-white rounded-xl text-xs font-bold shadow-sm border border-neutral-100/60 flex-shrink-0 tracking-wide uppercase">Jeans</button>
        <button onclick="filterHomeCategory('lower', this)" class="category-chip px-5 py-2.5 bg-white rounded-xl text-xs font-bold shadow-sm border border-neutral-100/60 flex-shrink-0 tracking-wide uppercase">Lower</button>
        <button onclick="filterHomeCategory('shoes', this)" class="category-chip px-5 py-2.5 bg-white rounded-xl text-xs font-bold shadow-sm border border-neutral-100/60 flex-shrink-0 tracking-wide uppercase">Shoes</button>
        <button onclick="filterHomeCategory('tshirt', this)" class="category-chip px-5 py-2.5 bg-white rounded-xl text-xs font-bold shadow-sm border border-neutral-100/60 flex-shrink-0 tracking-wide uppercase">T-Shirt</button>
      </div>
    </div>

    <!-- DYNAMIC HERO SECTION SPOTLIGHT CHOICE -->
    <div class="px-5 pt-2">
      <div id="heroSpotlightContainer">
        <!-- Loaded dynamically from Mongoose source model maps -->
      </div>
    </div>

    <!-- SCROLLABLE REAL LISTED PRODUCTS MATRIX FEED -->
    <div class="px-5 py-6 space-y-4">
      <div class="flex items-center justify-between px-0.5">
        <h2 class="font-black text-base uppercase tracking-tight text-neutral-900">New Collections</h2>
        <span onclick="window.location.href='/shop'" class="text-xs font-bold text-purple-600 uppercase tracking-wider cursor-pointer hover:underline">See All</span>
      </div>

      <!-- Infinite/Continuous Scrollable Listed Grid Box -->
      <div id="homeProductGrid" class="grid grid-cols-2 gap-4">
        <!-- Real dynamic database inventory item tokens loaded here -->
      </div>
    </div>

    <!-- MAIN APP CALL TO ACTION -->
    <div class="px-5 pb-8 pt-2">
      <button onclick="window.location.href='/shop'" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-black uppercase py-4.5 rounded-2xl text-xs tracking-widest shadow-lg shadow-purple-600/10 transition duration-200">
        Enter Premium Store Room →
      </button>
    </div>

    <!-- NATIVE BOTTOM NAV BAR (STUDIO OPTION REMOVED TRULY FOR USERS) -->
    <div class="bottom-nav flex items-center justify-around py-3 px-2 shadow-inner">
      <div onclick="window.location.href='/'" class="flex flex-col items-center gap-0.5 text-purple-600 cursor-pointer">
        <span class="text-xl leading-none">🏠</span>
        <span class="text-[9px] font-black uppercase tracking-wider">Home</span>
      </div>
      <div onclick="window.location.href='/shop'" class="flex flex-col items-center gap-0.5 text-neutral-400 hover:text-purple-600 cursor-pointer transition">
        <span class="text-xl leading-none">🛍️</span>
        <span class="text-[9px] font-black uppercase tracking-wider">Shop</span>
      </div>
    </div>

  </div>

  <!-- COMPILER DATA INTEGRATION CODES -->
  <script>
    const heroSpotlightContainer = document.getElementById('heroSpotlightContainer');
    const homeProductGrid = document.getElementById('homeProductGrid');
    let masterDatabaseArray = [];
    let homeActiveCategory = 'all';

    function formatRupeeSymbol(priceText) {
      let pureDigits = priceText.toString().replace(/[^0-9]/g, '').trim();
      return '₹' + (pureDigits || '0');
    }

    async function initHomeView() {
      try {
        const res = await fetch('/api/products');
        masterDatabaseArray = await res.json();
        renderHomeInterface();
      } catch(err) {
        homeProductGrid.innerHTML = '<p class="text-center text-xs text-red-400 font-bold col-span-2 py-6">Pipeline error sync.</p>';
      }
    }

    function filterHomeCategory(categoryKey, elementRef) {
      homeActiveCategory = categoryKey.toLowerCase().trim();
      document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
      elementRef.classList.add('active');
      renderHomeInterface();
    }

    function renderHomeInterface() {
      if (masterDatabaseArray.length === 0) {
        heroSpotlightContainer.innerHTML = `
          <div class="bg-white rounded-[32px] p-8 text-center text-xs font-bold text-neutral-400 uppercase tracking-widest border border-dashed border-neutral-200">
            Catalog collection clear inside cloud cluster. Publish items from admin view first.
          </div>`;
        homeProductGrid.innerHTML = '<div class="col-span-full text-center text-xs font-bold text-neutral-400 uppercase py-6">Feed Empty</div>';
        return;
      }

      // 1. Dynamic Extraction of Featured Hero Flag
      let featuredHeroItem = masterDatabaseArray.find(p => p.isFeatured === true);
      if(!featuredHeroItem) {
        featuredHeroItem = masterDatabaseArray[0]; 
      }

      const heroImg = featuredHeroItem.images && featuredHeroItem.images.length > 0 ? featuredHeroItem.images[0] : '';
      
      heroSpotlightContainer.innerHTML = `
        <div onclick="window.location.href='/shop'" class="bg-white rounded-[32px] p-4 shadow-sm border border-neutral-100/30 block cursor-pointer group relative overflow-hidden">
          <div class="aspect-[4/3] w-full bg-neutral-50 rounded-[24px] overflow-hidden relative mb-4 shadow-inner flex items-center justify-center">
            <img src="${heroImg}" class="w-full h-full object-cover transform group-hover:scale-101 transition duration-300">
            <div class="absolute top-3 left-3 bg-neutral-900/80 backdrop-blur-sm text-amber-400 font-black text-[9px] uppercase tracking-widest px-2.5 py-1 rounded-full shadow-sm flex items-center gap-0.5">★ 4.1 (10.2K+ reviews)</div>
          </div>
          <div class="flex items-center justify-between px-1">
            <div class="min-w-0 max-w-[70%]">
              <h3 class="font-extrabold text-[10px] text-purple-600 uppercase tracking-wider leading-none">${featuredHeroItem.category || 'Trending'} Drop</h3>
              <span class="text-base font-black text-neutral-900 uppercase tracking-tight block mt-1 truncate">${featuredHeroItem.title}</span>
            </div>
            <div class="text-right flex-shrink-0">
              <span class="block text-[9px] font-bold text-neutral-400 uppercase tracking-wider">Price</span>
              <span class="text-base font-black text-purple-600 block leading-none mt-0.5">${formatRupeeSymbol(featuredHeroItem.price)}</span>
            </div>
          </div>
        </div>`;

      // 2. Loop continuous listed grids tracking active category nodes
      let filteredGridItems = [...masterDatabaseArray];
      if(homeActiveCategory !== 'all') {
        filteredGridItems = filteredGridItems.filter(p => (p.category || '').toLowerCase().trim() === homeActiveCategory);
      }

      homeProductGrid.innerHTML = filteredGridItems.length === 0 
        ? '<div class="col-span-full py-12 text-center text-xs font-bold text-neutral-400 uppercase tracking-widest">No garments flagged under this section node.</div>' 
        : '';

      filteredGridItems.forEach(p => {
        const cardImg = p.images && p.images.length > 0 ? p.images[0] : '';
        homeProductGrid.innerHTML += `
          <div onclick="window.location.href='/shop'" class="bg-white rounded-[24px] p-3 shadow-sm border border-neutral-100/40 cursor-pointer flex flex-col justify-between group">
            <div>
              <div class="aspect-square w-full bg-neutral-50 rounded-[18px] overflow-hidden relative mb-2.5 shadow-inner">
                <img src="${cardImg}" class="w-full h-full object-cover">
                <div class="absolute top-2 right-2 bg-white/80 backdrop-blur-sm px-1.5 py-0.5 rounded-full text-[9px] font-black text-amber-600 shadow-sm flex items-center gap-0.5">★ 4.1</div>
              </div>
              <h4 class="font-bold text-xs uppercase text-neutral-800 tracking-tight line-clamp-1 px-0.5 leading-snug">${p.title}</h4>
            </div>
            <div class="flex items-center justify-between pt-2.5 border-t border-neutral-100/80 mt-2 px-0.5">
              <span class="font-black text-neutral-900 text-xs tracking-tight">${formatRupeeSymbol(p.price)}</span>
              <div class="w-6 h-6 bg-purple-600 text-white rounded-lg flex items-center justify-center font-bold text-xs shadow-sm">+</div>
            </div>
          </div>`;
      });
    }

    initHomeView();
  </script>
<script src="/script.js"></script>
</body>
</html>
