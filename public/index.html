<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAVEGIOUS | Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body class="font-[Plus_Jakarta_Sans] bg-white text-black">
  <header class="max-w-7xl mx-auto px-6 py-8 flex justify-between items-center">
    <span class="font-black text-2xl uppercase tracking-tighter">LAVEGIOUS</span>
    <nav class="hidden md:flex gap-8 font-bold text-sm uppercase"><a href="/shop">Shop</a><a href="/shop">Catalogue</a></nav>
  </header>
  <section class="max-w-7xl mx-auto px-6 py-20 flex flex-col md:flex-row items-center gap-12">
    <div class="w-full md:w-1/2 space-y-6">
      <h1 class="text-6xl md:text-8xl font-black uppercase leading-none">LET'S EXPLORE UNIQUE CLOTHES.</h1>
      <p class="text-gray-500 font-medium">Live for Influential and Innovative fashion!</p>
      <button onclick="window.location.href='/shop'" class="bg-black text-white px-10 py-4 rounded-xl font-bold uppercase tracking-widest hover:bg-neutral-800">Shop Now →</button>
    </div>
    <div class="w-full md:w-1/2">
      <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=800" class="rounded-3xl shadow-2xl">
    </div>
  </section>

</html>
